name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches a change in disslucc, dissmodel or a dependency

permissions:
  contents: read

jobs:
  benchmark:
    name: disslucc vs LuccME goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache pinned references (SHA-256 verified on every use)
        uses: actions/cache@v4
        with:
          path: .cache/references
          key: refs-${{ hashFiles('benchmarks/luccme_labs/references.toml') }}
      - name: Run the benchmark (exit 1 if a criterion is missed; table goes to the job summary)
        run: python benchmarks/luccme_labs/run.py
      - name: Coverage of the 21 labs
        if: always()
        run: python benchmarks/luccme_labs/run.py --coverage >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: reports/
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
