# Scenarios compared with the goldens. Each one has a stated criterion:
#   iterations = "exact"   convergence-loop iterations per year equal TerraME's
#   max_abs_error          largest |disslucc - golden| over every cell, year and column
#   max_error_rel          "Maximum error" per year vs the TerraME log (relative)
#   expect = "match"       the run exits 1 if a criterion is missed
#   expect = "differs"     reported only; used where the two differ by construction
#
# Thresholds are regression guards set just above what was measured (see README, section 4):
# float32 backends (lab01, lab15) leave ~1e-7 of noise; the float64 labs agree to the 12
# decimals the goldens keep (5e-13).

[lab01]
expect = "match"
iterations = "exact"
max_abs_error = 1e-6

["lab01/cell_correction"]
# disslucc runs correctCellChange by default (the intended algorithm). TerraME never does:
# its guard reads `cell.regionregionAloc`, a typo for `regionAloc`, so it is always false.
expect = "differs"
iterations = "exact"

[lab03]
expect = "match"
iterations = "exact"
max_abs_error = 1e-9
max_error_rel = 1e-9

[lab06]
expect = "match"
iterations = "exact"
max_abs_error = 1e-9
max_error_rel = 1e-9

[lab15]
expect = "match"
iterations = "exact"
max_abs_error = 1e-6

# Variants: the same lab with a smaller `maxDifference`, so the allocation's convergence loop
# actually runs (the lab scripts accept every year at the first pass).

[lab01_md1643]
expect = "match"
iterations = "exact"
max_abs_error = 1e-6

[lab15_md10]
expect = "match"
iterations = "exact"
max_abs_error = 1e-6

["lab01_md1643/cell_correction"]
# disslucc's default against the md1643 golden; the deviation that docs/validation.md reports.
expect = "differs"
iterations = "exact"
